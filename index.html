========================= -->

<div id="encounter-screen">

    <div class="encounter-box">


        <div class="scan-header">
            ███████████████████
        </div>


        <h2>
            MONSTERCODEX
        </h2>

            CLASSIFIED DATABASE

            Initialising secure scan...
        </p>


        <div class="loading-bar">

            <div class="loading-fill"></div>

        </div>


        <div id="scan-percent">
            0%
        </div>



        <img
            id="encounter-image"
            src=""
            alt=""
            style="
                display:none;
                max-width:220px;
                border-radius:12px;
                margin:20px auto;
            "
        >


        <h2
            id="encounter-name"
            style="display:none;"
        >
        </h2>


        <button
            id="encounter-button"
            style="display:none;"
        >
            ACCESS FILE
        </button>


    </div>


</div>
